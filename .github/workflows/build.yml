name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK (test ads)
        run: gradle assembleDebug

      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Check signing key
        if: env.KEYSTORE_BASE64 != ''
        continue-on-error: true
        run: |
          echo "BASE64 length: ${#KEYSTORE_BASE64} (should be 3700)"
          echo "STORE password length: ${#KEYSTORE_PASSWORD} (should be 18)"
          echo "KEY password length: ${#KEY_PASSWORD} (should be 18)"
          echo "ALIAS length: ${#KEY_ALIAS} (should be 5)"
          ls -l "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" 2>&1 | head -5

      - name: Build signed release APK (real ads)
        if: env.KEYSTORE_BASE64 != ''
        run: gradle assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Habit-Tracker-Shubh-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: Habit-Tracker-Shubh-RELEASE-APK
          path: app/build/outputs/apk/release/app-release.apk
