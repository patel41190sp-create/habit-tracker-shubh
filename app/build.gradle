plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shubh.habittracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.shubh.habittracker"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Start.io (StartApp) ads SDK
    implementation 'com.startapp:inapp-sdk:5.+'
}
